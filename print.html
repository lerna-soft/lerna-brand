<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brand Sheet · Lerna Brand</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Archivo:wght@400;700&family=Archivo+Black&family=Bebas+Neue&family=DM+Sans:wght@400;700&family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Libre+Baskerville:wght@400;700&family=Lora:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&family=Oswald:wght@400;700&family=Playfair+Display:wght@400;700&family=PT+Serif&family=Raleway:wght@400;700&family=Roboto:wght@400;500;700&family=Source+Sans+3:wght@400;600&family=Space+Grotesk:wght@400;700&family=Space+Mono&family=Syne:wght@400;700;800&family=Work+Sans:wght@400;700&display=swap" />
    <style>
      :root {
        --fg: #0a0a0a;
        --fg-mute: #5b5b5b;
        --line: #e4e4dc;
        --bg: #ffffff;
        --bg-alt: #f5f5f2;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--bg-alt); color: var(--fg); font-family: Inter, system-ui, sans-serif; }
      .toolbar {
        position: sticky; top: 0; z-index: 10;
        display: flex; justify-content: space-between; align-items: center;
        padding: 14px 24px;
        background: #ffffff;
        border-bottom: 1px solid var(--line);
      }
      .toolbar h1 { font-size: 14px; margin: 0; font-weight: 600; }
      .toolbar .links { display: flex; gap: 12px; }
      .toolbar a, .toolbar button {
        font: inherit; font-size: 13px;
        padding: 8px 14px; border: 1px solid var(--line); background: #fff; color: var(--fg);
        border-radius: 6px; cursor: pointer; text-decoration: none;
      }
      .toolbar button.primary { background: var(--fg); color: #fff; border-color: var(--fg); }

      .sheet {
        background: #ffffff;
        max-width: 820px;
        margin: 24px auto;
        padding: 56px 64px;
        box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 12px 36px -16px rgba(0,0,0,0.15);
      }

      .cover { text-align: center; padding-bottom: 48px; border-bottom: 1px solid var(--line); margin-bottom: 48px; }
      .cover .label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 3px; color: var(--fg-mute); text-transform: uppercase; }
      .cover h2 { font-size: 48px; margin: 16px 0 0; letter-spacing: -1px; }
      .cover p { color: var(--fg-mute); font-size: 16px; margin: 8px 0 0; }

      .section { margin-bottom: 48px; page-break-inside: avoid; }
      .section-head {
        display: flex; justify-content: space-between; align-items: baseline;
        border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 20px;
      }
      .section-head h3 { font-size: 14px; margin: 0; font-weight: 600; }
      .section-head .num { font-family: var(--font-mono); font-size: 11px; color: var(--fg-mute); letter-spacing: 2px; }

      .logo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .logo-card { border: 1px solid var(--line); padding: 24px; aspect-ratio: 2 / 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      .logo-card svg { width: 100%; height: auto; max-height: 100%; }
      .logo-card.dark { background: #0a0a0a; }
      .logo-card .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; color: var(--fg-mute); text-transform: uppercase; align-self: flex-end; }
      .logo-large { border: 1px solid var(--line); padding: 48px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
      .logo-large svg { width: 100%; max-width: 560px; height: auto; }

      .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
      .swatch { border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
      .swatch-color { height: 96px; }
      .swatch-meta { padding: 10px 12px; font-family: var(--font-mono); font-size: 11px; }
      .swatch-meta .hex { font-weight: 600; color: var(--fg); }
      .swatch-meta .rgb { color: var(--fg-mute); margin-top: 2px; font-size: 10px; }

      .typography-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
      .typo { border: 1px solid var(--line); padding: 20px; }
      .typo .role { font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; color: var(--fg-mute); text-transform: uppercase; }
      .typo .family { font-family: var(--font-mono); font-size: 11px; color: var(--fg-mute); margin: 4px 0 12px; }
      .typo .sample { font-size: 40px; line-height: 1.1; margin: 0; }
      .typo .sample.body { font-size: 16px; line-height: 1.5; font-weight: 400; }

      .scale { display: grid; grid-template-columns: 60px 1fr; gap: 12px; align-items: baseline; padding-block: 4px; border-bottom: 1px dotted var(--line); }
      .scale:last-child { border-bottom: 0; }
      .scale-meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-mute); }

      .rules-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .rule { border: 1px solid var(--line); padding: 16px; }
      .rule-head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
      .rule.do .rule-head::before { content: "✓"; color: #2f8a5b; font-weight: 700; }
      .rule.dont .rule-head::before { content: "✕"; color: #b91c1c; font-weight: 700; }
      .rule p { margin: 0; font-size: 13px; color: var(--fg-mute); line-height: 1.5; }

      .colophon {
        margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line);
        display: flex; justify-content: space-between;
        font-family: var(--font-mono); font-size: 10px; color: var(--fg-mute); letter-spacing: 1px;
      }

      .empty { text-align: center; padding: 80px 24px; color: var(--fg-mute); }
      .empty a { color: var(--fg); }

      @media print {
        .toolbar { display: none; }
        body { background: #ffffff; }
        .sheet { margin: 0; box-shadow: none; padding: 24mm 18mm; max-width: 100%; }
        @page { size: A4; margin: 0; }
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <h1>Brand sheet</h1>
      <div class="links">
        <a href="app.html">← Back to builder</a>
        <button type="button" class="primary" id="btn-print">Print / Save PDF</button>
      </div>
    </header>

    <main id="root">
      <div class="empty">
        <p>Loading your kit…</p>
      </div>
    </main>

    <script src="renderer.js"></script>
    <script>
      (async function () {
        "use strict";

        function decodeHash() {
          try {
            const h = (location.hash || "").replace(/^#/, "");
            if (!h) return null;
            return JSON.parse(decodeURIComponent(escape(atob(h))));
          } catch (e) { return null; }
        }
        function readLocal() {
          try { return JSON.parse(localStorage.getItem("lerna-brand:state:v1") || "null"); } catch (e) { return null; }
        }

        async function loadJson(path) {
          try { const r = await fetch(path); return r.ok ? await r.json() : null; } catch (e) { return null; }
        }

        function hexToRgb(hex) {
          const v = String(hex || "").replace("#", "");
          const n = v.length === 3 ? v.split("").map((c) => c + c).join("") : v;
          const num = parseInt(n, 16);
          if (Number.isNaN(num)) return "0, 0, 0";
          return [(num >> 16) & 255, (num >> 8) & 255, num & 255].join(", ");
        }

        const params = decodeHash();
        const local = readLocal();
        const src = params ? {
          name: params.n,
          tagline: params.t,
          templateId: params.tpl,
          paletteId: params.pal,
          fontId: params.f,
        } : (local ? {
          name: local.name,
          tagline: local.tagline,
          templateId: local.templateId,
          paletteId: local.paletteId,
          fontId: local.fontId,
        } : null);

        const root = document.getElementById("root");
        if (!src || !src.name || !src.templateId || !src.paletteId || !src.fontId) {
          root.innerHTML = '<div class="empty"><p>No kit found. <a href="app.html">Build one first ↗</a></p></div>';
          return;
        }

        const [templates, palettes, fonts] = await Promise.all([
          loadJson("data/templates.json"),
          loadJson("data/palettes.json"),
          loadJson("data/fonts.json"),
        ]);

        const template = (templates || []).find((t) => t.id === src.templateId);
        const palette = (palettes || []).find((p) => p.id === src.paletteId);
        const fontPair = (fonts || []).find((f) => f.id === src.fontId);
        if (!template || !palette || !fontPair) {
          root.innerHTML = '<div class="empty"><p>Kit references unknown seeds. <a href="app.html">Rebuild ↗</a></p></div>';
          return;
        }

        const state = { name: src.name, tagline: src.tagline || "", template, palette, fontPair };

        const Render = window.LernaBrandRender;
        const logoLarge = Render.renderSvg(state, { width: 800, height: 400, background: palette.colors[3] });

        // dark variant: swap c0/c2 against dark bg
        const darkState = JSON.parse(JSON.stringify(state));
        darkState.palette = { id: palette.id + "-dark", colors: [palette.colors[2], palette.colors[1], palette.colors[0], palette.colors[3]] };
        const logoDark = Render.renderSvg(darkState, { width: 800, height: 400, background: "#0a0a0a" });

        // mono variant: black-on-white
        const monoState = JSON.parse(JSON.stringify(state));
        monoState.palette = { id: "mono", colors: ["#0a0a0a", "#555555", "#cccccc", "#ffffff"] };
        const logoMono = Render.renderSvg(monoState, { width: 800, height: 400, background: "#ffffff" });

        const palSwatches = palette.colors.map((c, i) => {
          const role = ["Primary", "Accent", "Surface", "Background"][i] || "Color " + (i + 1);
          return '<div class="swatch">'
            + '<div class="swatch-color" style="background:' + c + '"></div>'
            + '<div class="swatch-meta"><div>' + role + '</div>'
            + '<div class="hex">' + c.toUpperCase() + '</div>'
            + '<div class="rgb">rgb(' + hexToRgb(c) + ')</div>'
            + '</div></div>';
        }).join("");

        const scale = [
          { role: "Display", size: 56, weight: fontPair.weights.heading || 700, family: fontPair.heading, text: state.name },
          { role: "H1", size: 36, weight: fontPair.weights.heading || 700, family: fontPair.heading, text: "Section title" },
          { role: "H2", size: 24, weight: 600, family: fontPair.heading, text: "Subsection" },
          { role: "Body", size: 16, weight: fontPair.weights.body || 400, family: fontPair.body, text: "Body copy reads naturally at sixteen pixels with comfortable line height. Use this scale for paragraphs longer than a line." },
          { role: "Caption", size: 12, weight: 500, family: fontPair.body, text: "Caption · meta · 12px" },
        ];
        const scaleRows = scale.map((r) => '<div class="scale">'
          + '<div class="scale-meta">' + r.role + '<br/>' + r.size + 'px</div>'
          + '<div style="font-family:' + r.family + '; font-weight:' + r.weight + '; font-size:' + r.size + 'px; line-height:1.2">' + r.text + '</div>'
          + '</div>').join("");

        root.innerHTML = ''
          + '<article class="sheet">'
          + '  <div class="cover">'
          + '    <div class="label">Brand Guidelines</div>'
          + '    <h2 style="font-family:' + fontPair.heading + '">' + escapeHtml(state.name) + '</h2>'
          + '    ' + (state.tagline ? '<p>' + escapeHtml(state.tagline) + '</p>' : '')
          + '  </div>'

          + '  <section class="section">'
          + '    <div class="section-head"><h3>Logo · primary</h3><span class="num">01</span></div>'
          + '    <div class="logo-large">' + logoLarge + '</div>'
          + '  </section>'

          + '  <section class="section">'
          + '    <div class="section-head"><h3>Logo · variants</h3><span class="num">02</span></div>'
          + '    <div class="logo-grid">'
          + '      <div class="logo-card dark"><div>' + logoDark + '</div></div>'
          + '      <div class="logo-card"><div>' + logoMono + '</div></div>'
          + '    </div>'
          + '  </section>'

          + '  <section class="section">'
          + '    <div class="section-head"><h3>Palette · ' + escapeHtml(palette.name) + '</h3><span class="num">03</span></div>'
          + '    <div class="palette">' + palSwatches + '</div>'
          + '  </section>'

          + '  <section class="section">'
          + '    <div class="section-head"><h3>Typography · ' + escapeHtml(fontPair.name) + '</h3><span class="num">04</span></div>'
          + '    <div class="typography-grid">'
          + '      <div class="typo">'
          + '        <div class="role">Heading</div>'
          + '        <div class="family">' + escapeHtml(fontPair.heading) + '</div>'
          + '        <p class="sample" style="font-family:' + fontPair.heading + '; font-weight:' + (fontPair.weights.heading || 700) + '">The quick brown fox</p>'
          + '      </div>'
          + '      <div class="typo">'
          + '        <div class="role">Body</div>'
          + '        <div class="family">' + escapeHtml(fontPair.body) + '</div>'
          + '        <p class="sample body" style="font-family:' + fontPair.body + '">A wonderful serenity has taken possession of my entire soul, like these sweet mornings of spring which I enjoy with my whole heart.</p>'
          + '      </div>'
          + '    </div>'
          + '    <div style="margin-top:20px">' + scaleRows + '</div>'
          + '  </section>'

          + '  <section class="section">'
          + '    <div class="section-head"><h3>Usage</h3><span class="num">05</span></div>'
          + '    <div class="rules-grid">'
          + '      <div class="rule do"><div class="rule-head">Do</div><p>Give the logo at least 1× its height of empty space on all sides.</p></div>'
          + '      <div class="rule do"><div class="rule-head">Do</div><p>Use the primary mark over the surface or background color from the palette.</p></div>'
          + '      <div class="rule dont"><div class="rule-head">Don\'t</div><p>Stretch, skew or recolor the mark outside of the variants above.</p></div>'
          + '      <div class="rule dont"><div class="rule-head">Don\'t</div><p>Place the primary mark on busy photography without a solid panel behind it.</p></div>'
          + '    </div>'
          + '  </section>'

          + '  <div class="colophon">'
          + '    <span>Generated with lerna-brand · ' + new Date().toLocaleDateString() + '</span>'
          + '    <span>' + escapeHtml(template.name) + '</span>'
          + '  </div>'
          + '</article>';

        document.getElementById("btn-print").addEventListener("click", () => window.print());

        function escapeHtml(s) {
          return String(s == null ? "" : s).replace(/[<>&"']/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;", "'": "&#39;" })[c]);
        }
      })();
    </script>
  </body>
</html>
