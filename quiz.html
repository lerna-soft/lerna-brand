<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lerna Brand · Find your style</title>
    <meta name="description" content="Answer 5 quick questions, get 24 logo variations curated for your brand." />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Archivo:wght@400;700&family=Archivo+Black&family=Bebas+Neue&family=DM+Sans:wght@400;700&family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Libre+Baskerville:wght@400;700&family=Lora:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&family=Oswald:wght@400;700&family=Playfair+Display:wght@400;700&family=PT+Serif&family=Raleway:wght@400;700&family=Roboto:wght@400;500;700&family=Source+Sans+3:wght@400;600&family=Space+Grotesk:wght@400;700&family=Space+Mono&family=Syne:wght@400;700;800&family=Work+Sans:wght@400;700&display=swap" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="quiz">
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand" href="index.html" aria-label="Lerna Brand">
          <span class="brand-mark">LERNABRAND</span>
        </a>
        <a class="btn btn-ghost topbar-cta" href="app.html">Skip · Build manually</a>
      </div>
    </header>

    <main class="quiz-shell" id="quiz-root">
      <section class="quiz-stage" id="quiz-stage">
        <p class="quiz-progress" id="quiz-progress">Loading…</p>
        <div id="quiz-content"></div>
      </section>
    </main>

    <script src="renderer.js"></script>
    <script>
      (async function () {
        "use strict";

        const STORAGE_PREFS = "lerna-brand:quiz:v1";
        const STORAGE_STATE = "lerna-brand:state:v1";

        async function loadJson(p) { const r = await fetch(p); return r.ok ? await r.json() : null; }

        const [quiz, templates, palettes, fonts] = await Promise.all([
          loadJson("data/quiz.json"),
          loadJson("data/templates.json"),
          loadJson("data/palettes.json"),
          loadJson("data/fonts.json"),
        ]);

        const root = document.getElementById("quiz-content");
        const progressEl = document.getElementById("quiz-progress");
        const answers = {};
        let qIdx = 0;

        function showQuestion(i) {
          const q = quiz[i];
          progressEl.textContent = `Question ${i + 1} of ${quiz.length}`;
          root.innerHTML = `
            <h1 class="quiz-q">${q.q}</h1>
            <div class="quiz-options">
              ${q.options.map((o, j) => `
                <button type="button" class="quiz-option" data-q="${q.id}" data-i="${j}">
                  <span class="quiz-option-label">${o.label}</span>
                </button>
              `).join("")}
            </div>
            ${i > 0 ? '<button type="button" class="quiz-back" id="quiz-back">← Back</button>' : ""}
          `;
          root.querySelectorAll(".quiz-option").forEach((b) => {
            b.addEventListener("click", () => {
              answers[q.id] = q.options[+b.dataset.i].tags;
              qIdx++;
              if (qIdx < quiz.length) showQuestion(qIdx);
              else showVariations();
            });
          });
          const back = document.getElementById("quiz-back");
          if (back) back.addEventListener("click", () => { qIdx--; showQuestion(qIdx); });
        }

        // ============ engine v2 ============
        // Color harmony: classify palette by hue distance between c0 and c1.
        function hexToHsl(hex) {
          const v = String(hex || "").replace("#", "");
          const n = v.length === 3 ? v.split("").map((c) => c + c).join("") : v;
          const num = parseInt(n, 16);
          if (Number.isNaN(num)) return [0, 0, 0];
          let r = ((num >> 16) & 255) / 255, g = ((num >> 8) & 255) / 255, b = (num & 255) / 255;
          const max = Math.max(r, g, b), min = Math.min(r, g, b);
          const l = (max + min) / 2;
          let h = 0, s = 0;
          if (max !== min) {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) { case r: h = ((g - b) / d + (g < b ? 6 : 0)); break; case g: h = ((b - r) / d + 2); break; case b: h = ((r - g) / d + 4); break; }
            h *= 60;
          }
          return [h, s * 100, l * 100];
        }
        function paletteHarmonyTag(p) {
          const a = hexToHsl(p.colors[0]);
          const b = hexToHsl(p.colors[1]);
          const diff = Math.abs(a[0] - b[0]);
          const d = diff > 180 ? 360 - diff : diff;
          if (d < 30) return "monochromatic";
          if (d < 60) return "analogous";
          if (d > 150) return "complementary";
          if (d > 100 && d < 140) return "triadic";
          return "neutral";
        }
        function paletteVibrancyTag(p) {
          const s = hexToHsl(p.colors[1])[1];
          if (s > 70) return "vibrant";
          if (s > 30) return "muted";
          return "neutral";
        }

        // Font pairing rule: serif heading + sans body (or vice versa) gets a bonus.
        function familyType(family) {
          if (!family) return "sans";
          const lower = family.toLowerCase();
          if (/(serif|playfair|merriweather|libre|lora|abril|pt serif|baskerville)/.test(lower) && !/sans/.test(lower)) return "serif";
          if (/(mono|jetbrains|space mono)/.test(lower)) return "mono";
          return "sans";
        }
        function fontPairingBonus(fp) {
          const h = familyType(fp.heading);
          const b = familyType(fp.body);
          if (h === b) return 0;          // same family type — fine but unremarkable
          if (h !== "mono" && b !== "mono") return 2; // serif/sans complementary
          return 1;
        }

        function scoreCombination(template, palette, fontPair, prefTags, chips) {
          const tplTags = template.tags || [];
          const palTags = (palette.mood || "").split(" · ");
          const fontTags = (fontPair.mood || "").split(" · ");
          const harmony = paletteHarmonyTag(palette);
          const vibrancy = paletteVibrancyTag(palette);
          const allTags = tplTags.concat(palTags).concat(fontTags).concat([harmony, vibrancy]);
          let base = prefTags.reduce((acc, t) => acc + (allTags.indexOf(t) !== -1 ? 1 : 0), 0);
          base += fontPairingBonus(fontPair);
          // Chip biases: + for matching, slight - for opposite
          if (chips.has("bold") && (allTags.includes("bold") || allTags.includes("punch") || allTags.includes("vibrant"))) base += 2;
          if (chips.has("minimal") && (allTags.includes("minimal") || allTags.includes("calm") || allTags.includes("monoink") || allTags.includes("monochromatic"))) base += 2;
          if (chips.has("colorful") && (vibrancy === "vibrant" || harmony === "complementary" || harmony === "triadic")) base += 2;
          if (chips.has("serif") && (familyType(fontPair.heading) === "serif" || familyType(fontPair.body) === "serif")) base += 2;
          if (chips.has("warm") && (palTags.includes("warm") || palTags.includes("artisan") || palTags.includes("food") || palTags.includes("vibrant"))) base += 2;
          if (chips.has("cool") && (palTags.includes("calm") || palTags.includes("fresh") || palTags.includes("fintech") || palTags.includes("corporate"))) base += 2;
          return base;
        }

        // Weighted random sampling without replacement (temperature)
        function sampleWeighted(items, n, seenSet) {
          const pool = items.filter((it) => !seenSet.has(it.key));
          if (!pool.length) return [];
          // Boltzmann weights
          const T = 1.2;
          const max = pool.reduce((m, x) => Math.max(m, x.s), 0);
          const weights = pool.map((x) => Math.exp((x.s - max) / T));
          const total = weights.reduce((a, b) => a + b, 0);
          const out = [];
          const used = new Set();
          while (out.length < n && used.size < pool.length) {
            let r = Math.random() * total;
            let pickIdx = -1;
            for (let i = 0; i < pool.length; i++) {
              if (used.has(i)) continue;
              r -= weights[i];
              if (r <= 0) { pickIdx = i; break; }
            }
            if (pickIdx === -1) {
              for (let i = 0; i < pool.length; i++) if (!used.has(i)) { pickIdx = i; break; }
            }
            used.add(pickIdx);
            out.push(pool[pickIdx]);
          }
          return out;
        }

        const activeChips = new Set();
        const seenCombos = new Set();
        function buildVariations(prefTags, n) {
          const all = [];
          for (const t of templates) for (const p of palettes) for (const f of fonts) {
            const key = t.id + ":" + p.id + ":" + f.id;
            const s = scoreCombination(t, p, f, prefTags, activeChips);
            all.push({ t, p, f, s, key });
          }
          // Filter: keep those with score > 0 if any, else fall back to entire pool
          let pool = all.filter((x) => x.s > 0);
          if (pool.length < n) pool = all;
          // Weighted sample + diversity cap
          const sampled = sampleWeighted(pool, n * 3, seenCombos); // oversample
          const cap = Math.max(2, Math.floor(n / 3));
          const counts = {};
          const out = [];
          for (const item of sampled) {
            counts[item.t.id] = counts[item.t.id] || 0;
            if (counts[item.t.id] >= cap) continue;
            counts[item.t.id]++;
            seenCombos.add(item.key);
            out.push(item);
            if (out.length >= n) break;
          }
          return out;
        }

        function showVariations(append) {
          const prefTags = Object.keys(answers).reduce((acc, k) => acc.concat(answers[k]), []);
          try { localStorage.setItem(STORAGE_PREFS, JSON.stringify({ tags: prefTags, at: Date.now() })); } catch (e) {}
          const combos = buildVariations(prefTags, 24);
          progressEl.textContent = "We curated these for you · pick one to keep editing";

          const chips = [
            { id: "bold", label: "Bolder" },
            { id: "minimal", label: "More minimal" },
            { id: "colorful", label: "More colorful" },
            { id: "warm", label: "Warmer" },
            { id: "cool", label: "Cooler" },
            { id: "serif", label: "Serif" },
          ];
          const chipBar = chips.map((c) => `
            <button type="button" class="chip ${activeChips.has(c.id) ? "is-on" : ""}" data-chip="${c.id}">${c.label}</button>
          `).join("");

          const cardsHtml = combos.map((c, i) => `
            <button type="button" class="quiz-card" data-key="${c.key}">
              <div class="quiz-card-canvas" style="background:${c.p.colors[3] || '#fff'}">${
                window.LernaBrandRender.renderSvg(
                  { name: "Your Brand", tagline: "", template: c.t, palette: c.p, fontPair: c.f },
                  { width: 400, height: 200 }
                )
              }</div>
              <div class="quiz-card-meta">
                <span>${c.t.name.split(" · ")[0]}</span>
                <span>${c.p.name}</span>
              </div>
            </button>
          `).join("");

          if (append) {
            const grid = document.getElementById("quiz-grid");
            grid.insertAdjacentHTML("beforeend", cardsHtml);
          } else {
            root.innerHTML = `
              <div class="chip-bar">${chipBar}</div>
              <div class="quiz-grid" id="quiz-grid">${cardsHtml}</div>
              <div class="quiz-actions">
                <button type="button" class="btn btn-ghost" id="more">Show 24 more</button>
                <button type="button" class="btn btn-ghost" id="regenerate">Regenerate</button>
                <a class="btn btn-ghost" href="app.html">Build manually instead</a>
              </div>
            `;
            document.querySelectorAll(".chip").forEach((b) => {
              b.addEventListener("click", () => {
                const id = b.dataset.chip;
                if (activeChips.has(id)) activeChips.delete(id); else activeChips.add(id);
                seenCombos.clear();
                showVariations(false);
              });
            });
            document.getElementById("more").addEventListener("click", () => showVariations(true));
            document.getElementById("regenerate").addEventListener("click", () => {
              seenCombos.clear();
              showVariations(false);
            });
          }
          // wire card clicks
          document.querySelectorAll(".quiz-card").forEach((b) => {
            if (b.dataset.wired) return;
            b.dataset.wired = "1";
            b.addEventListener("click", () => {
              const key = b.dataset.key;
              const found = combos.find((c) => c.key === key) || ((window._allCombos || []).find((c) => c.key === key));
              if (!found) return;
              const snap = {
                step: "identity",
                name: "",
                tagline: "",
                templateId: found.t.id,
                paletteId: found.p.id,
                fontId: found.f.id,
              };
              try { localStorage.setItem(STORAGE_STATE, JSON.stringify(snap)); } catch (e) {}
              location.href = "app.html";
            });
          });
          // remember combos for "show more" click resolution
          window._allCombos = (window._allCombos || []).concat(combos);
        }

        if (!quiz || !templates || !palettes || !fonts) {
          root.innerHTML = '<p class="quiz-q">Failed to load. <a href="app.html">Open the builder ↗</a></p>';
          return;
        }
        showQuestion(0);
      })();
    </script>
  </body>
</html>
