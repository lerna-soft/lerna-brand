name: Sync Google Fonts metadata
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 */3 *"  # quarterly

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build google-fonts.json
        run: |
          mkdir -p data
          curl -sL "https://fonts.google.com/metadata/fonts" \
            | jq '[.familyMetadataList[] | { family, category, weights: (.fonts | keys | map(select(test("i$") | not))), popularity }] | sort_by(.popularity)' \
            > data/google-fonts.json
          jq 'length' data/google-fonts.json
          wc -c data/google-fonts.json
      - name: Commit changes
        run: |
          if git diff --quiet data/google-fonts.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/google-fonts.json
          git commit -m "chore: regenerate google fonts metadata"
          git push
